<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blog</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; color: #1a1c22; }
    h1 { font-size: 1.5rem; }
    .post { padding: 16px 0; border-bottom: 1px solid #e4e3de; }
    .post a { font-size: 1.1rem; font-weight: 600; text-decoration: none; color: #1a1c22; }
    .post a:hover { text-decoration: underline; }
    .post .meta { font-size: 0.85rem; color: #6b6f76; margin-top: 4px; }
    .empty { color: #6b6f76; }
    .new-post { display: inline-block; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Blog</h1>
  {% if posts|length == 0 %}
    <p class="empty">No posts yet.</p>
  {% else %}
    {% for post in posts %}
    <div class="post">
      <a href="/blog/{{ post.slug }}">{{ post.title }}</a>
      <div class="meta">{{ post.created_at }}</div>
    </div>
    {% endfor %}
  {% endif %}
  <a class="new-post" href="/blog/new">Write a post</a>
</body>
</html>
