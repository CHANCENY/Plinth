<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Write a post</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; color: #1a1c22; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #e4e3de; border-radius: 4px; font: inherit; }
    textarea { min-height: 160px; }
    .error { color: #a83232; font-size: 0.85rem; margin-top: 4px; }
    button { padding: 8px 16px; background: #2fa89f; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Write a post</h1>
  <form method="post" action="/blog/new">
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{ old.title|default('') }}" required>
      {% if errors.title %}<div class="error">{{ errors.title[0] }}</div>{% endif %}
    </div>
    <div class="field">
      <label for="body">Body</label>
      <textarea id="body" name="body" required>{{ old.body|default('') }}</textarea>
      {% if errors.body %}<div class="error">{{ errors.body[0] }}</div>{% endif %}
    </div>
    <button type="submit">Publish</button>
  </form>
</body>
</html>
