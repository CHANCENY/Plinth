{% extends "auth/auth" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1 class="auth-title">Reset your password</h1>
<p class="auth-subtitle">Choose a new password for your account.</p>

{% if errors.token %}<div class="alert alert-error">{{ errors.token[0] }}</div>{% endif %}

<form method="post" action="/reset-password/{{ token }}">
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ old.email|default(email) }}" required autofocus>
  </div>
  <div class="field">
    <label for="password">New password</label>
    <input type="password" id="password" name="password" required>
    {% if errors.password %}<div class="field-error">{{ errors.password[0] }}</div>{% endif %}
  </div>
  <div class="field">
    <label for="password_confirmation">Confirm new password</label>
    <input type="password" id="password_confirmation" name="password_confirmation" required>
  </div>
  <button type="submit" class="btn-block btn-primary">Reset password</button>
</form>
{% endblock %}
