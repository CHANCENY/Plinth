<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #14161c;
      --paper: #f6f6f4;
      --surface: #ffffff;
      --border: #e4e3de;
      --text: #1a1c22;
      --text-muted: #6b6f76;
      --accent: #2fa89f;
      --accent-strong: #1f7a73;
      --danger-bg: #fbe4e4;
      --danger-text: #a83232;
      --success-bg: #e3f5f3;
      --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      font-family: var(--font-sans);
      color: var(--text);
      padding: 24px;
      font-size: 15px;
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 32px;
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .auth-title { margin: 0 0 6px; font-size: 1.375rem; font-weight: 600; }
    .auth-subtitle { margin: 0 0 24px; color: var(--text-muted); font-size: 0.9375rem; line-height: 1.5; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      color: var(--text);
      background: var(--surface);
    }
    .field input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    .field-error { color: var(--danger-text); font-size: 0.8125rem; margin-top: 4px; }

    .btn-block {
      display: block;
      width: 100%;
      text-align: center;
      padding: 10px 14px;
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 120ms ease;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-strong); }

    .alert { padding: 10px 14px; border-radius: 6px; font-size: 0.875rem; margin-bottom: 16px; line-height: 1.5; }
    .alert-error { background: var(--danger-bg); color: var(--danger-text); }
    .alert-success { background: var(--success-bg); color: var(--accent-strong); }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: var(--text-muted);
      font-size: 0.8125rem;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    .oauth-buttons { display: flex; flex-direction: column; gap: 10px; }
    .btn-oauth {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: border-color 120ms ease;
    }
    .btn-oauth:hover { border-color: var(--text-muted); }
    .btn-oauth svg { flex-shrink: 0; }

    .auth-footer { margin-top: 24px; text-align: center; font-size: 0.875rem; color: var(--text-muted); line-height: 1.7; }
    .auth-footer a { color: var(--accent-strong); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }

    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="20" height="20" rx="5" stroke="#2fa89f" stroke-width="2"/>
        <rect x="9" y="9" width="8" height="8" rx="2" fill="#2fa89f"/>
      </svg>
      <span>Admin Panel</span>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
