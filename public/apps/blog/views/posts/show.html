<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ post.title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; color: #1a1c22; line-height: 1.6; }
    .meta { font-size: 0.85rem; color: #6b6f76; margin-bottom: 20px; }
    a.back { font-size: 0.9rem; color: #6b6f76; text-decoration: none; }
  </style>
</head>
<body>
  <a class="back" href="/blog">&larr; Back to blog</a>
  <h1>{{ post.title }}</h1>
  <div class="meta">{{ post.created_at }}</div>
  <div>{{ post.body }}</div>
</body>
</html>
