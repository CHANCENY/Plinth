<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* color */
      --ink: #14161c;
      --ink-elevated: #1c1f29;
      --ink-border: #272b36;
      --paper: #f6f6f4;
      --surface: #ffffff;
      --border: #e4e3de;
      --text: #1a1c22;
      --text-muted: #6b6f76;
      --text-inverse: #c9ccd3;
      --text-inverse-muted: #80838d;
      --accent: #2fa89f;
      --accent-strong: #1f7a73;
      --focus-ring: #2fa89f;

      --status-active-bg: #e3f5f3;
      --status-active-text: #1f7a73;
      --status-pending-bg: #fbf0df;
      --status-pending-text: #96631e;
      --status-suspended-bg: #fce8dc;
      --status-suspended-text: #b5561f;
      --status-blocked-bg: #fbe4e4;
      --status-blocked-text: #a83232;
      --status-deleted-bg: #ececea;
      --status-deleted-text: #6b6f76;

      /* type */
      --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --sidebar-width: 248px;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      color: var(--text);
      background: var(--paper);
      font-size: 15px;
      line-height: 1.5;
    }
    a { color: inherit; }

    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* ---------- sidebar ---------- */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--ink);
      color: var(--text-inverse);
      display: flex;
      flex-direction: column;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 18px;
      border-bottom: 1px solid var(--ink-border);
    }
    .sidebar-brand a {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .sidebar-mark { flex-shrink: 0; }

    .sidebar-nav { flex: 1; padding: 18px 0; overflow-y: auto; }
    .sidebar-group + .sidebar-group { margin-top: 20px; }
    .sidebar-group-label {
      padding: 0 18px 6px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-inverse-muted);
    }
    .sidebar-group ul { list-style: none; margin: 0; padding: 0; }
    .sidebar-group a {
      display: block;
      padding: 8px 18px 8px 15px;
      font-size: 0.9375rem;
      font-weight: 500;
      text-decoration: none;
      color: var(--text-inverse);
      border-left: 3px solid transparent;
      transition: background-color 120ms ease, color 120ms ease;
    }
    .sidebar-group a:hover { background: var(--ink-elevated); color: #fff; }
    .sidebar-group a.active {
      background: var(--ink-elevated);
      color: #fff;
      border-left-color: var(--accent);
    }

    .sidebar-user {
      padding: 16px 18px;
      border-top: 1px solid var(--ink-border);
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .sidebar-user-name {
      color: #fff;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sidebar-user a {
      color: var(--text-inverse-muted);
      text-decoration: none;
      flex-shrink: 0;
    }
    .sidebar-user a:hover { color: #fff; }

    /* ---------- content ---------- */
    .content { flex: 1; min-width: 0; }

    .content-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .content-title { margin: 0; font-size: 1.375rem; font-weight: 600; }
    .content-body { padding: 28px 32px; }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-strong); }
    .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--text-muted); }

    /* ---------- table ---------- */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
      overflow-y: hidden;
    }
    table { width: 100%; min-width: 640px; border-collapse: collapse; }
    thead th {
      text-align: left;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9375rem;
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafaf9; }
    .cell-muted { color: var(--text-muted); }
    .cell-mono { font-family: var(--font-mono); font-size: 0.875rem; color: var(--text-muted); }
    .cell-actions { text-align: right; white-space: nowrap; }
    .cell-actions a {
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      color: var(--text-muted);
      margin-left: 14px;
    }
    .cell-actions a:hover { color: var(--text); }
    .cell-actions a.danger:hover { color: var(--status-blocked-text); }

    .status-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 0.8125rem;
      font-weight: 500;
    }
    .status-active { background: var(--status-active-bg); color: var(--status-active-text); }
    .status-pending { background: var(--status-pending-bg); color: var(--status-pending-text); }
    .status-suspended { background: var(--status-suspended-bg); color: var(--status-suspended-text); }
    .status-blocked { background: var(--status-blocked-bg); color: var(--status-blocked-text); }
    .status-deleted { background: var(--status-deleted-bg); color: var(--status-deleted-text); }

    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state p { margin: 0; font-size: 0.9375rem; }

    /* ---------- role pill (reuses the status-pill look) ---------- */
    .role-admin { background: var(--status-active-bg); color: var(--status-active-text); }
    .role-member { background: var(--status-deleted-bg); color: var(--status-deleted-text); }

    /* ---------- dashboard stat cards ---------- */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .stat-value { font-size: 1.75rem; font-weight: 600; line-height: 1.2; }
    .stat-label { margin-top: 4px; font-size: 0.875rem; color: var(--text-muted); }
    .stat-card a { text-decoration: none; color: inherit; display: block; }
    .stat-card a:hover .stat-value { color: var(--accent-strong); }

    /* ---------- forms (create/edit pages) ---------- */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      max-width: 480px;
    }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      color: var(--text);
      background: var(--surface);
    }
    .field textarea { resize: vertical; }
    .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    .field-hint { margin-top: 4px; font-size: 0.8125rem; color: var(--text-muted); }
    .field-error { color: var(--status-blocked-text); font-size: 0.8125rem; margin-top: 4px; }
    .alert { padding: 10px 14px; border-radius: 6px; font-size: 0.875rem; margin-bottom: 16px; }
    .alert-error { background: var(--status-blocked-bg); color: var(--status-blocked-text); }
    .alert-success { background: var(--status-active-bg); color: var(--status-active-text); }
    .form-actions { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
    .form-actions .btn-cancel { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
    .form-actions .btn-cancel:hover { color: var(--text); }
    .delete-form { display: inline; margin-left: 14px; }
    .delete-form button {
      background: none; border: none; padding: 0; margin: 0; cursor: pointer;
      font: inherit; font-size: 0.875rem; font-weight: 500; color: var(--text-muted);
    }
    .delete-form button:hover { color: var(--status-blocked-text); }

    /* ---------- permissions matrix + permission pickers ---------- */
    .form-card.wide { max-width: 640px; }
    .matrix { min-width: 0; }
    .matrix thead th.role-col { text-align: center; }
    .role-key { display: block; font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 400; color: var(--text-muted); }
    .matrix td.check { text-align: center; }
    .matrix input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .matrix input[type="checkbox"]:disabled { cursor: not-allowed; opacity: 0.55; }
    .matrix tr.group-row td {
      background: #f3f3f0;
      padding: 8px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .matrix tbody tr.group-row:hover { background: #f3f3f0; }
    .perm-label { font-weight: 500; }
    .perm-key { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
    .perm-desc { margin-top: 2px; font-size: 0.8125rem; color: var(--text-muted); }
    .badge-custom {
      display: inline-block; padding: 1px 7px; border-radius: 100px; font-size: 0.6875rem; font-weight: 500;
      background: var(--status-pending-bg); color: var(--status-pending-text);
    }
    .matrix-footer { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
    .check-inline { display: flex; align-items: flex-start; gap: 8px; font-size: 0.875rem; cursor: pointer; }
    .check-inline input { margin-top: 3px; accent-color: var(--accent); }
    .perm-fieldset { border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px 14px; margin: 0 0 16px; }
    .perm-fieldset legend { font-size: 0.875rem; font-weight: 500; padding: 0 6px; }
    .perm-fieldset .check-inline { margin: 7px 0; }
    .perm-all { padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .perm-group-name { margin-top: 10px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }

    /* ---------- accessibility / quality floor ---------- */
    a:focus-visible, button:focus-visible, .btn:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

    /* ---------- responsive ---------- */
    @media (max-width: 800px) {
      .app-shell { flex-direction: column; }
      .sidebar { width: 100%; }
      .sidebar-nav { padding: 10px 0; }
      .sidebar-group ul { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 12px; }
      .sidebar-group a { border-left: none; border-radius: 6px; padding: 6px 10px; }
      .sidebar-group a.active { border-left: none; }
      .content-topbar, .content-body { padding-left: 18px; padding-right: 18px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    {% include "partials/nav" %}
    <div class="content">
      <div class="content-topbar">
        <h1 class="content-title">{% block page_title %}Dashboard{% endblock %}</h1>
        {% block page_actions %}{% endblock %}
      </div>
      <div class="content-body">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</body>
</html>
